---
- name: Provision this workstation
  hosts: workstation
  gather_facts: true
  vars_files:
    - vars.yml
  tasks:
    - name: Validate dotfiles prerequisites (profile, OS)
      ansible.builtin.import_tasks: tasks/validate.yml
      tags: [always]

    - name: Resolve private overlay for this platform
      ansible.builtin.include_role:
        name: private
      when: dotfiles_private_enabled | bool
      tags: [always]

    - name: Install packages
      ansible.builtin.include_role:
        name: packages
      tags: [packages]

    - name: Link dotfile configurations
      ansible.builtin.import_role:
        name: stow
      tags: [stow]

    - name: Set up user tools
      ansible.builtin.import_role:
        name: user-tools
      when: dotfiles_profile in ["default", "personal", "work"]
      tags: [tools]

    - name: Schedule optional package drift reports
      ansible.builtin.import_role:
        name: reports
      when: dotfiles_profile in ["default", "personal", "work"]
      tags: [package-report]
