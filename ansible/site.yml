---
- name: Provision this workstation
  hosts: workstation
  gather_facts: true
  vars_files:
    - vars.yml
  tasks:
    - name: Check supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in ["Fedora", "Ubuntu"] or ansible_facts['system'] == "Darwin"
        fail_msg: "This playbook supports Fedora, Ubuntu, and macOS."

    - name: Install OS packages
      ansible.builtin.include_tasks:
        file: "tasks/{{ 'macos' if ansible_facts['system'] == 'Darwin' else ansible_facts['distribution'] | lower }}.yml"
        apply:
          tags: [packages]
      tags: [packages]

    - name: Link dotfile configurations
      ansible.builtin.import_tasks: tasks/stow.yml
      tags: [stow]

    - name: Set up user tools
      ansible.builtin.import_tasks: tasks/user-tools.yml
      tags: [tools]
