---
- name: Provision this workstation
  hosts: workstation
  gather_facts: true
  vars_files:
    - vars.yml
  tasks:
    - name: Validate profile
      ansible.builtin.assert:
        that:
          - dotfiles_profile in ["default", "server", "personal", "work"]
        fail_msg: "Invalid profile. Supported profiles are: default, server, personal, work."
      tags: [always]

    - name: Resolve base profile for workstation-based profiles
      ansible.builtin.set_fact:
        dotfiles_base_profile: "{{ 'server' if dotfiles_profile == 'server' else 'default' }}"
      tags: [always]

    - name: Load profile defaults
      ansible.builtin.include_vars:
        file: "profiles/{{ dotfiles_base_profile }}.yml"
      tags: [always]

    - name: Disable Snap by default outside Ubuntu
      ansible.builtin.set_fact:
        dotfiles_install_snap_apps: false
      when:
        - ansible_facts['os_family'] == 'Debian'
        - ansible_facts['distribution'] != 'Ubuntu'
        - dotfiles_install_snap_apps | bool
      tags: [always]

    - name: Check supported operating system
      ansible.builtin.assert:
        that:
          - >-
            (dotfiles_profile in ["default", "personal", "work"] and
             (ansible_facts['system'] == "Darwin" or
              ansible_facts['distribution'] == "Fedora" or
              ansible_facts['os_family'] == "Debian")) or
            (dotfiles_profile == "server" and
             ansible_facts['os_family'] == "Debian")
        fail_msg: >-
          Unsupported OS/profile combination. Profiles default/personal/work support
          Fedora, macOS, and Debian-family distributions (Ubuntu 24.04+ or Debian 13+).
          The server profile supports Debian-family distributions only (Ubuntu 24.04+ or Debian 13+).
      tags: [always]

    - name: Require Debian 13 or newer
      ansible.builtin.assert:
        that:
          - (ansible_facts['distribution_major_version'] | int) >= 13
        fail_msg: "Debian {{ ansible_facts['distribution_version'] }} is not supported. Debian 13 (trixie) or newer is required."
      when: ansible_facts['distribution'] == 'Debian'
      tags: [always]

    - name: Require Ubuntu 24.04 or newer
      ansible.builtin.assert:
        that:
          - (ansible_facts['distribution_major_version'] | int) >= 24
        fail_msg: "Ubuntu {{ ansible_facts['distribution_version'] }} is not supported. Ubuntu 24.04 or newer is required."
      when: ansible_facts['distribution'] == 'Ubuntu'
      tags: [always]

    - name: Require a supported private overlay profile
      ansible.builtin.assert:
        that:
          - dotfiles_profile in ["personal", "work"]
        fail_msg: >-
          dotfiles_private_enabled is true but the selected profile '{{ dotfiles_profile }}'
          is not an overlay-capable profile. Private overlays are only available with the
          'personal' or 'work' profiles.
      when: dotfiles_private_enabled | bool
      tags: [always]

    - name: Select private overlay package manifests for this platform
      ansible.builtin.set_fact:
        dotfiles_private_package_manifests: >-
          {{
            (['Brewfile']
             if dotfiles_private_profile in ['work', 'personal'] and ansible_facts['system'] == 'Darwin'
             else (
               ['Brewfile']
               if dotfiles_private_profile in ['work', 'personal']
               else (
                 ['apt-packages.txt']
                 + (['snap-packages.txt'] if dotfiles_install_snap_apps | bool else [])
                 if ansible_facts['os_family'] == 'Debian'
                 else (
                   ['dnf-packages.txt']
                   + (['flatpak-packages.txt'] if dotfiles_install_flatpak_apps | bool else [])
                 )
               )
             ))
          }}
      when: dotfiles_private_enabled | bool
      tags: [always]

    - name: Check the private overlay package manifests
      ansible.builtin.stat:
        path: "{{ dotfiles_private_path }}/ansible/packages/{{ item }}"
      loop: "{{ dotfiles_private_package_manifests | default([]) }}"
      register: dotfiles_private_package_manifest_files
      when:
        - dotfiles_private_enabled | bool
        - dotfiles_private_package_manifests | length > 0
      tags: [always]

    - name: Install Fedora packages
      ansible.builtin.include_tasks:
        file: tasks/fedora.yml
        apply:
          tags: [packages]
      when:
        - dotfiles_profile in ["default", "personal", "work"]
        - ansible_facts['distribution'] == "Fedora"
      tags: [packages]

    - name: Install apt-family packages
      ansible.builtin.include_tasks:
        file: tasks/ubuntu.yml
        apply:
          tags: [packages]
      when:
        - dotfiles_profile in ["default", "personal", "work"]
        - ansible_facts['os_family'] == "Debian"
      tags: [packages]

    - name: Install macOS packages
      ansible.builtin.include_tasks:
        file: tasks/macos.yml
        apply:
          tags: [packages]
      when:
        - dotfiles_profile in ["default", "personal", "work"]
        - ansible_facts['system'] == "Darwin"
      tags: [packages]

    - name: Install server packages
      ansible.builtin.include_tasks:
        file: tasks/server.yml
        apply:
          tags: [packages]
      when: dotfiles_profile == "server"
      tags: [packages]

    - name: Link dotfile configurations
      ansible.builtin.import_tasks: tasks/stow.yml
      tags: [stow]

    - name: Set up user tools
      ansible.builtin.import_tasks: tasks/user-tools.yml
      when: dotfiles_profile in ["default", "personal", "work"]
      tags: [tools]

    - name: Schedule optional package drift reports
      ansible.builtin.import_tasks: tasks/package-report.yml
      when: dotfiles_profile in ["default", "personal", "work"]
      tags: [package-report]
