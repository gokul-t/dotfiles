---
- name: Provision this workstation
  hosts: workstation
  gather_facts: true
  vars_files:
    - vars.yml
  tasks:
    - name: Check supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Fedora" or ansible_facts['system'] == "Darwin"
        fail_msg: "This playbook supports Fedora Linux and macOS."

    - name: Install Fedora packages and Flatpak apps
      ansible.builtin.import_tasks: tasks/fedora.yml
      when: ansible_facts['distribution'] == "Fedora"

    - name: Install macOS packages
      ansible.builtin.import_tasks: tasks/macos.yml
      when: ansible_facts['system'] == "Darwin"

    - name: Link dotfile configurations
      ansible.builtin.import_tasks: tasks/stow.yml

    - name: Set up user tools
      ansible.builtin.import_tasks: tasks/user-tools.yml
