---
- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
    depth: 1

- name: Create Oh My Zsh plugin directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins"
    state: directory
    mode: "0755"

- name: Install configured Zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
  loop:
    - name: zsh-autosuggestions
      repo: https://github.com/zsh-users/zsh-autosuggestions.git
    - name: zsh-syntax-highlighting
      repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    - name: you-should-use
      repo: https://github.com/MichaelAquilina/zsh-you-should-use.git

- name: Install Tmux Plugin Manager
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.tmux/plugins/tpm"
    depth: 1

- name: Install Lazy-Idea
  ansible.builtin.git:
    repo: https://github.com/cufarvid/lazy-idea.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.lazy-idea"
    depth: 1

- name: Install mise
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://mise.run | sh
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
    executable: /bin/bash

- name: Check whether the mise configuration is linked
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/mise/config.toml"
  register: dotfiles_mise_config

- name: Trust the linked mise configuration
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
      - trust
      - "{{ ansible_facts['env']['HOME'] }}/.config/mise/config.toml"
  when: dotfiles_mise_config.stat.exists
  changed_when: false

- name: Find the installed Zsh executable
  ansible.builtin.shell: command -v zsh
  register: dotfiles_zsh_path
  changed_when: false

- name: Set Zsh as the current user's login shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "{{ dotfiles_zsh_path.stdout }}"
