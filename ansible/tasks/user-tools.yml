---
- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
    depth: 1

- name: Create Oh My Zsh plugin directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins"
    state: directory
    mode: "0755"

- name: Install configured Zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
  loop:
    - name: zsh-autosuggestions
      repo: https://github.com/zsh-users/zsh-autosuggestions.git
    - name: zsh-syntax-highlighting
      repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    - name: you-should-use
      repo: https://github.com/MichaelAquilina/zsh-you-should-use.git

- name: Install Tmux Plugin Manager
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.tmux/plugins/tpm"
    depth: 1

- name: Install Lazy-Idea
  ansible.builtin.git:
    repo: https://github.com/cufarvid/lazy-idea.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.lazy-idea"
    depth: 1

- name: Create the user-local binary directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Check whether bin is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/bin"
  register: dotfiles_bin

- name: Map the bin release platform
  ansible.builtin.set_fact:
    dotfiles_bin_platform: "{{ 'darwin' if ansible_facts['system'] == 'Darwin' else 'linux' }}"
    dotfiles_bin_arch: >-
      {{
        {'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}
        .get(ansible_facts['architecture'], '')
      }}
  when:
    - "'bin' not in dotfiles_skip_tools"
    - not dotfiles_bin.stat.exists

- name: Read the latest bin release metadata
  ansible.builtin.uri:
    url: https://api.github.com/repos/marcosnils/bin/releases/latest
    return_content: true
    headers:
      Accept: application/vnd.github+json
  register: dotfiles_bin_release
  changed_when: false
  when:
    - "'bin' not in dotfiles_skip_tools"
    - not dotfiles_bin.stat.exists

- name: Select the matching bin release asset
  ansible.builtin.set_fact:
    dotfiles_bin_asset: >-
      {{
        dotfiles_bin_release.json.assets
        | selectattr(
            'name',
            'search',
            '^bin_.*_' ~ dotfiles_bin_platform ~ '_' ~ dotfiles_bin_arch ~ '$'
          )
        | list
      }}
  when:
    - "'bin' not in dotfiles_skip_tools"
    - not dotfiles_bin.stat.exists

- name: Validate the bin release asset
  ansible.builtin.assert:
    that:
      - dotfiles_bin_arch | length > 0
      - dotfiles_bin_asset | length == 1
      - dotfiles_bin_asset[0].digest is defined
      - dotfiles_bin_asset[0].digest is match('^sha256:[0-9a-f]{64}$')
    fail_msg: "Could not find a checksummed bin release for this platform."
  when:
    - "'bin' not in dotfiles_skip_tools"
    - not dotfiles_bin.stat.exists

- name: Create a temporary directory for the bin bootstrap
  ansible.builtin.tempfile:
    state: directory
    prefix: dotfiles-bin-
  register: dotfiles_bin_bootstrap
  when:
    - "'bin' not in dotfiles_skip_tools"
    - not dotfiles_bin.stat.exists

- name: Install bin using its quick-install command
  block:
    - name: Download the bin bootstrap executable
      ansible.builtin.get_url:
        url: "{{ dotfiles_bin_asset[0].browser_download_url }}"
        dest: "{{ dotfiles_bin_bootstrap.path }}/bin"
        checksum: "{{ dotfiles_bin_asset[0].digest }}"
        mode: "0755"

    - name: Install bin to the user-local binary directory
      ansible.builtin.command:
        argv:
          - "{{ dotfiles_bin_bootstrap.path }}/bin"
          - install
          - "{{ dotfiles_bin_asset[0].browser_download_url }}"
          - "{{ ansible_facts['env']['HOME'] }}/.local/bin/bin"
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/bin"
  when:
    - "'bin' not in dotfiles_skip_tools"
    - not dotfiles_bin.stat.exists
  always:
    - name: Remove the bin bootstrap directory
      ansible.builtin.file:
        path: "{{ dotfiles_bin_bootstrap.path }}"
        state: absent
      when:
        - dotfiles_bin_bootstrap is defined
        - dotfiles_bin_bootstrap.path is defined

- name: Ensure bin is executable
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/bin"
    state: file
    mode: "0755"
  when: "'bin' not in dotfiles_skip_tools"

- name: Install configured binaries with bin
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/bin"
      - install
      - "{{ item.source }}"
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item.name }}"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item.name }}"
  loop: "{{ dotfiles_bin_packages }}"
  when: "'bin' not in dotfiles_skip_tools"

- name: Install mise
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://mise.run | sh
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
    executable: /bin/bash

- name: Check whether the mise configuration is linked
  ansible.builtin.stat:
    path: "{{ dotfiles_stow_target }}/.config/mise/config.toml"
  register: dotfiles_mise_config

- name: Trust the linked mise configuration
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
      - trust
      - "{{ dotfiles_stow_target }}/.config/mise/config.toml"
  when: dotfiles_mise_config.stat.exists
  changed_when: false
  environment:
    MISE_CONFIG_FILE: "{{ dotfiles_stow_target }}/.config/mise/config.toml"

- name: Install the configured tools with mise
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
      - install
  register: dotfiles_mise_install
  changed_when: false
  failed_when: >-
    dotfiles_mise_install.rc != 0
    and not (
      'rust@' in (dotfiles_mise_install.stderr | default(''))
      and 'SIGILL' in (dotfiles_mise_install.stderr | default(''))
    )
  environment:
    MISE_CONFIG_FILE: "{{ dotfiles_stow_target }}/.config/mise/config.toml"

- name: Warn when Rust installation hits the known Rustup SIGILL bug
  ansible.builtin.debug:
    msg: >-
      mise could not install Rust because rustup-init exited with SIGILL.
      This matches the upstream Rustup 1.29.2 CPU-instruction bug
      (rust-lang/rustup#5160). Other configured tools will continue installing,
      but Rust is unavailable. Retry the Rust installation after Rustup 1.29.3
      or newer is available.
  when:
    - dotfiles_mise_install.rc != 0
    - "'rust@' in (dotfiles_mise_install.stderr | default(''))"
    - "'SIGILL' in (dotfiles_mise_install.stderr | default(''))"

- name: Install LazyGit with Go
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
      - exec
      - --
      - go
      - install
      - github.com/jesseduffield/lazygit@latest
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/lazygit"
  environment:
    GOBIN: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    MISE_CONFIG_FILE: "{{ dotfiles_stow_target }}/.config/mise/config.toml"
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Find the installed Zsh executable
  ansible.builtin.shell: command -v zsh
  register: dotfiles_zsh_path
  changed_when: false

- name: Set Zsh as the current user's login shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "{{ dotfiles_zsh_path.stdout }}"
