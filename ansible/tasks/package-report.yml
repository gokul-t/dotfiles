---
# Package drift report scheduling using user-installed-packages library.
# The library's 'schedule' subcommand handles cross-platform scheduler
# management (systemd on Linux, LaunchAgent on macOS, cron fallback).

- name: Select the package report manifest directory
  ansible.builtin.set_fact:
    dotfiles_package_report_manifest_dir: "{{ dotfiles_repo_path }}/ansible/packages"
    dotfiles_package_report_args: >-
      {{
      (['--brewfile', dotfiles_repo_path ~ '/ansible/packages/Brewfile']
       + (['--brewfile', dotfiles_private_path ~ '/ansible/packages/Brewfile']
          if dotfiles_private_enabled | bool else []))
      if ansible_facts['system'] == 'Darwin'
      else (
        ['--dnf-manifest', dotfiles_repo_path ~ '/ansible/packages/dnf-packages.txt']
        + (['--dnf-manifest', dotfiles_private_path ~ '/ansible/packages/dnf-packages.txt']
           if dotfiles_private_enabled | bool else [])
        + (['--flatpak-manifest', dotfiles_repo_path ~ '/ansible/packages/flatpak-packages.txt']
           if dotfiles_install_flatpak_apps | bool else [])
        + (['--flatpak-manifest', dotfiles_private_path ~ '/ansible/packages/flatpak-packages.txt']
           if dotfiles_install_flatpak_apps | bool and dotfiles_private_enabled | bool else [])
        if ansible_facts['distribution'] == 'Fedora'
        else (
          ['--apt-manifest', dotfiles_repo_path ~ '/ansible/packages/apt-packages.txt']
          + (['--apt-manifest', dotfiles_private_path ~ '/ansible/packages/apt-packages.txt']
             if dotfiles_private_enabled | bool else [])
          + (['--snap-manifest', dotfiles_repo_path ~ '/ansible/packages/snap-packages.txt']
             if dotfiles_install_snap_apps | bool else [])
          + (['--snap-manifest', dotfiles_private_path ~ '/ansible/packages/snap-packages.txt']
             if dotfiles_install_snap_apps | bool and dotfiles_private_enabled | bool else [])
        )
      )
      }}

- name: Build package report skip arguments
  ansible.builtin.set_fact:
    dotfiles_package_report_skips: >-
      {{
      (dotfiles_fedora_skip_packages if ansible_facts['distribution'] == 'Fedora'
       else dotfiles_ubuntu_skip_packages if ansible_facts['os_family'] == 'Debian'
       else [])
      }}

- name: Create the package report directory
  ansible.builtin.file:
    path: "{{ dotfiles_package_report_dir }}"
    state: directory
    mode: "0700"
  when: dotfiles_package_report_schedule | bool

- name: Build schedule command - enable case
  ansible.builtin.set_fact:
    dotfiles_schedule_arg_list: >-
      {{
        ['user-installed-packages', 'schedule', '--enable',
         '--manifest-dir', dotfiles_package_report_manifest_dir,
         '--output', dotfiles_package_report_dir ~ '/package-report.txt']
      + dotfiles_package_report_args
      + (dotfiles_package_report_skips | map('regex_replace', '^(.*)$', '--skip=\\1') | list)
      + (['--no-flatpak'] if not dotfiles_install_flatpak_apps | bool else [])
      + (['--no-snap'] if not dotfiles_install_snap_apps | bool else [])
      }}
  when: dotfiles_package_report_schedule | bool

- name: Build schedule command - disable case
  ansible.builtin.set_fact:
    dotfiles_schedule_arg_list: >-
      {{
        ['user-installed-packages', 'schedule', '--disable',
         '--manifest-dir', dotfiles_package_report_manifest_dir,
         '--output', dotfiles_package_report_dir ~ '/package-report.txt']
      + dotfiles_package_report_args
      + (dotfiles_package_report_skips | map('regex_replace', '^(.*)$', '--skip=\\1') | list)
      + (['--no-flatpak'] if not dotfiles_install_flatpak_apps | bool else [])
      + (['--no-snap'] if not dotfiles_install_snap_apps | bool else [])
      }}
  when: not dotfiles_package_report_schedule | bool

- name: Schedule or unschedule package drift report
  ansible.builtin.command:
    argv: "{{ dotfiles_schedule_arg_list }}"
  environment:
    PATH: >-
      {{
      (['/opt/homebrew/bin', '/usr/local/bin', '/usr/bin', '/bin', '/usr/sbin', '/sbin',
        ansible_facts['env']['HOME'] ~ '/.local/bin']
        | join(':')
      )
      }}
  register: dotfiles_scheduler_result
  changed_when:
    - dotfiles_scheduler_result.rc == 0
    - "'already' not in dotfiles_scheduler_result.stderr"
  failed_when: dotfiles_scheduler_result.rc == 2