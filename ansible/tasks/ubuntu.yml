---
- name: Read Ubuntu package manifest
  ansible.builtin.set_fact:
    dotfiles_ubuntu_packages: >-
      {{
        lookup('ansible.builtin.file', dotfiles_repo_path ~ '/ubuntu-packages.txt')
        .splitlines()
        | map('trim')
        | reject('match', '^#')
        | reject('equalto', '')
        | reject('in', dotfiles_ubuntu_skip_packages | default([]))
        | list
      }}

- name: Install Ubuntu packages
  become: true
  ansible.builtin.apt:
    name: "{{ dotfiles_ubuntu_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
