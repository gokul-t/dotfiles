---
- name: Validate profile
  ansible.builtin.assert:
    that:
      - dotfiles_profile in ["default", "server", "personal", "work"]
    fail_msg: "Invalid profile. Supported profiles are: default, server, personal, work."
  tags: [always]

- name: Resolve base profile for workstation-based profiles
  ansible.builtin.set_fact:
    dotfiles_base_profile: "{{ 'server' if dotfiles_profile == 'server' else 'default' }}"
  tags: [always]

- name: Set the GitHub API token
  ansible.builtin.set_fact:
    dotfiles_github_api_token: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"
  tags: [always]

- name: Load profile defaults
  ansible.builtin.include_vars:
    file: "profiles/{{ dotfiles_base_profile }}.yml"
  tags: [always]

- name: Disable Snap by default outside Ubuntu
  ansible.builtin.set_fact:
    dotfiles_install_snap_apps: false
  when:
    - ansible_facts['os_family'] == 'Debian'
    - ansible_facts['distribution'] != 'Ubuntu'
    - dotfiles_install_snap_apps | bool
  tags: [always]

- name: Check supported operating system
  ansible.builtin.assert:
    that:
      - >-
        (dotfiles_profile in ["default", "personal", "work"] and
         (ansible_facts['system'] == "Darwin" or
          ansible_facts['distribution'] == "Fedora" or
          ansible_facts['os_family'] == "Debian")) or
        (dotfiles_profile == "server" and
         ansible_facts['os_family'] in ["Debian", "RedHat"])
    fail_msg: >-
      Unsupported OS/profile combination. Profiles default/personal/work support
      Fedora, macOS, and Debian-family distributions (Ubuntu 24.04+ or Debian 13+).
      The server profile supports Debian-family distributions (Ubuntu 24.04+ or Debian 13+)
      and RedHat-family distributions (Fedora, RHEL/CentOS/Rocky/Alma derivatives, 9+).
  tags: [always]

- name: Require Debian 13 or newer
  ansible.builtin.assert:
    that:
      - (ansible_facts['distribution_major_version'] | int) >= 13
    fail_msg: "Debian {{ ansible_facts['distribution_version'] }} is not supported. Debian 13 (trixie) or newer is required."
  when: ansible_facts['distribution'] == 'Debian'
  tags: [always]

- name: Require Ubuntu 24.04 or newer
  ansible.builtin.assert:
    that:
      - (ansible_facts['distribution_major_version'] | int) >= 24
    fail_msg: "Ubuntu {{ ansible_facts['distribution_version'] }} is not supported. Ubuntu 24.04 or newer is required."
  when: ansible_facts['distribution'] == 'Ubuntu'
  tags: [always]

- name: Require RedHat family version
  ansible.builtin.assert:
    that:
      - (ansible_facts['distribution_major_version'] | int) >= 9
    fail_msg: >-
      RedHat-family distribution {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      is not supported. RedHat 9 or newer is required.
  when: ansible_facts['os_family'] == 'RedHat'
  tags: [always]
