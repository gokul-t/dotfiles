---
- name: Find dotfile packages
  ansible.builtin.find:
    paths: "{{ dotfiles_repo_path }}"
    file_type: directory
    recurse: false
  register: dotfiles_stow_directories

- name: Create Stow target directory
  ansible.builtin.file:
    path: "{{ dotfiles_stow_target }}"
    state: directory
    mode: "0755"

- name: Select dotfile packages to link
  ansible.builtin.set_fact:
    dotfiles_stow_selected: >-
      {{
        (dotfiles_stow_packages if dotfiles_stow_packages | length > 0
         else dotfiles_profile_stow_packages)
        | difference(dotfiles_stow_skip_packages)
        | list
      }}

- name: Validate selected dotfile packages
  ansible.builtin.assert:
    that:
      - item in (dotfiles_stow_directories.files | map(attribute='path') | map('basename') | list)
    fail_msg: "Unknown dotfile package '{{ item }}': no such top-level directory."
    quiet: true
  loop: "{{ dotfiles_stow_selected }}"

- name: Link selected dotfile packages with GNU Stow
  ansible.builtin.command:
    argv:
      - stow
      - --dir
      - "{{ dotfiles_repo_path }}"
      - --target
      - "{{ dotfiles_stow_target }}"
      - --stow
      - --verbose=1
      - "{{ item }}"
  loop: "{{ dotfiles_stow_selected }}"
  register: dotfiles_stow_result
  changed_when: "'LINK:' in ((dotfiles_stow_result.stdout | default('')) ~ (dotfiles_stow_result.stderr | default('')))"
  failed_when:
    - dotfiles_stow_result.rc != 0
    - "'would cause conflicts:' not in (dotfiles_stow_result.stderr | default(''))"

- name: Warn about dotfile packages with existing-file conflicts
  ansible.builtin.debug:
    msg: >-
      Stow skipped package '{{ item.item }}' because target files already exist.
      Existing files were left untouched. Resolve these conflicts and rerun
      setup to link this package:
      {{ item.stderr | trim }}
  loop: "{{ dotfiles_stow_result.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Fail when strict mode finds Stow conflicts
  ansible.builtin.fail:
    msg: >-
      Stow conflicts in: {{ dotfiles_stow_result.results
      | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}
  when:
    - dotfiles_stow_strict | bool
    - dotfiles_stow_result.results | selectattr('rc', 'ne', 0) | list | length > 0
