---
- name: Install DNF repository support
  become: true
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Configure the Microsoft Visual Studio Code repository
  become: true
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    gpgcheck: true
    enabled: true

- name: Configure the Google Chrome repository
  become: true
  ansible.builtin.yum_repository:
    name: google-chrome
    description: Google Chrome
    baseurl: https://dl.google.com/linux/chrome/rpm/stable/$basearch
    gpgkey: https://dl.google.com/linux/linux_signing_key.pub
    gpgcheck: true
    enabled: true
  when: ansible_facts['architecture'] == "x86_64"

- name: Configure the HashiCorp repository
  become: true
  ansible.builtin.yum_repository:
    name: hashicorp
    description: HashiCorp Stable - $basearch
    baseurl: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable
    gpgkey: https://rpm.releases.hashicorp.com/gpg
    gpgcheck: true
    enabled: true

- name: Check whether the sesh Copr repository is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:buckaroogeek:Tmux_sesh.repo
  register: dotfiles_sesh_copr_repo

- name: Enable the sesh Copr repository
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - buckaroogeek/Tmux_sesh
  when: not dotfiles_sesh_copr_repo.stat.exists

- name: Read Fedora package manifest
  ansible.builtin.set_fact:
    dotfiles_dnf_packages_all: >-
      {{
        lookup('ansible.builtin.file', dotfiles_repo_path ~ '/dnf-packages.txt')
        .splitlines()
        | map('trim')
        | reject('match', '^#')
        | reject('equalto', '')
        | list
      }}

- name: Select Fedora packages for optional Flatpak installation
  ansible.builtin.set_fact:
    dotfiles_dnf_packages: >-
      {{
        dotfiles_dnf_packages_all
        | reject('equalto', 'flatpak')
        | list
        if not dotfiles_install_flatpak_apps | bool
        else dotfiles_dnf_packages_all
      }}

- name: Exclude explicitly skipped Fedora packages
  ansible.builtin.set_fact:
    dotfiles_dnf_packages: >-
      {{
        dotfiles_dnf_packages
        | reject('in', dotfiles_fedora_skip_packages | default([]))
        | list
      }}

- name: Select Fedora packages for this architecture
  ansible.builtin.set_fact:
    dotfiles_dnf_packages: >-
      {{
        dotfiles_dnf_packages
        | reject('equalto', 'google-chrome-stable')
        | list
        if ansible_facts['architecture'] != 'x86_64'
        else dotfiles_dnf_packages
      }}

- name: Check whether the Starship Copr repository is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:atim:starship.repo
  register: dotfiles_starship_copr_repo
  when: "'starship' in dotfiles_dnf_packages"

- name: Enable the Starship Copr repository
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - atim/starship
  when:
    - "'starship' in dotfiles_dnf_packages"
    - not dotfiles_starship_copr_repo.stat.exists

- name: Check whether the Ghostty Copr repository is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo
  register: dotfiles_ghostty_copr_repo
  when: "'ghostty' in dotfiles_dnf_packages"

- name: Enable the Ghostty Copr repository
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - scottames/ghostty
  when:
    - "'ghostty' in dotfiles_dnf_packages"
    - not dotfiles_ghostty_copr_repo.stat.exists

- name: Check whether the LazyGit Copr repository is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:dejan:lazygit.repo
  register: dotfiles_lazygit_copr_repo
  when: "'lazygit' in dotfiles_dnf_packages"

- name: Enable the LazyGit Copr repository
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - dejan/lazygit
  when:
    - "'lazygit' in dotfiles_dnf_packages"
    - not dotfiles_lazygit_copr_repo.stat.exists

- name: Check whether the Yazi Copr repository is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:lihaohong:yazi.repo
  register: dotfiles_yazi_copr_repo
  when: "'yazi' in dotfiles_dnf_packages"

- name: Enable the Yazi Copr repository
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - lihaohong/yazi
  when:
    - "'yazi' in dotfiles_dnf_packages"
    - not dotfiles_yazi_copr_repo.stat.exists

- name: Install Fedora packages
  become: true
  ansible.builtin.dnf:
    name: "{{ dotfiles_dnf_packages }}"
    state: present
    update_cache: true

- name: Generate the sesh Zsh completion
  ansible.builtin.command:
    argv:
      - sesh
      - completion
      - zsh
  register: dotfiles_sesh_zsh_completion
  changed_when: false

- name: Create the system-wide Zsh completion directory
  become: true
  ansible.builtin.file:
    path: /usr/local/share/zsh/site-functions
    state: directory
    mode: "0755"

- name: Install the system-wide sesh Zsh completion
  become: true
  ansible.builtin.copy:
    content: "{{ dotfiles_sesh_zsh_completion.stdout }}\n"
    dest: /usr/local/share/zsh/site-functions/_sesh
    mode: "0644"

- name: Read Flatpak application manifest
  ansible.builtin.set_fact:
    dotfiles_flatpak_apps: >-
      {{
        lookup('ansible.builtin.file', dotfiles_repo_path ~ '/flatpak-packages.txt')
        .splitlines()
        | map('trim')
        | reject('match', '^#')
        | reject('equalto', '')
        | list
      }}
  when: dotfiles_install_flatpak_apps | bool

- name: List configured system Flatpak remotes
  become: true
  ansible.builtin.command:
    argv:
      - flatpak
      - remote-list
      - --system
      - --columns=name
  register: dotfiles_flatpak_remotes
  changed_when: false
  when: dotfiles_install_flatpak_apps | bool

- name: Add required system Flatpak remotes
  become: true
  ansible.builtin.command:
    argv:
      - flatpak
      - remote-add
      - --system
      - --if-not-exists
      - "{{ item.name }}"
      - "{{ item.url }}"
  loop:
    - name: flathub
      url: https://flathub.org/repo/flathub.flatpakrepo
    - name: fedora
      url: https://dl.fedoraproject.org/pub/flatpak/repo/fedora.flatpakrepo
  when:
    - dotfiles_install_flatpak_apps | bool
    - item.name not in dotfiles_flatpak_remotes.stdout_lines

- name: List installed system Flatpak applications
  become: true
  ansible.builtin.command:
    argv:
      - flatpak
      - list
      - --system
      - --app
      - --columns=application
  register: dotfiles_installed_flatpak_apps
  changed_when: false
  when: dotfiles_install_flatpak_apps | bool

- name: Install missing Flatpak applications
  become: true
  ansible.builtin.command:
    argv:
      - flatpak
      - install
      - --system
      - --assumeyes
      - "{{ item.split()[0] }}"
      - "{{ item.split()[1] }}"
  loop: "{{ dotfiles_flatpak_apps }}"
  when:
    - dotfiles_install_flatpak_apps | bool
    - item.split()[1] not in dotfiles_installed_flatpak_apps.stdout_lines

- name: Create user font directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
    state: directory
    mode: "0755"

- name: Check for the Meslo Nerd Font
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
    patterns: "MesloLGS NF Regular.ttf"
    recurse: true
  register: dotfiles_meslo_font

- name: Download Meslo Nerd Font archive
  ansible.builtin.get_url:
    url: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Meslo.zip
    dest: /tmp/dotfiles-meslo-nerd-fonts.zip
    mode: "0644"
  when: dotfiles_meslo_font.matched == 0

- name: Install Meslo Nerd Font
  ansible.builtin.unarchive:
    src: /tmp/dotfiles-meslo-nerd-fonts.zip
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
    remote_src: true
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/MesloLGS NF Regular.ttf"
  when: dotfiles_meslo_font.matched == 0
  register: dotfiles_meslo_font_install

- name: Refresh user font cache
  ansible.builtin.command:
    argv:
      - fc-cache
      - -f
      - "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
  when: dotfiles_meslo_font_install.changed | default(false)
