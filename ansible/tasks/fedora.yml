---
- name: Install DNF repository support
  become: true
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Check whether the RPM Fusion repositories are configured
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/yum.repos.d/rpmfusion-free.repo
    - /etc/yum.repos.d/rpmfusion-nonfree.repo
  register: dotfiles_rpmfusion_repos

# dnf5 refuses to install the release RPMs directly: the '@commandline'
# repository has no OpenPGP keys configured. Import the keys and install
# the signed release RPMs with rpm instead.
- name: Import the RPM Fusion GPG keys
  become: true
  ansible.builtin.rpm_key:
    state: present
    key: "{{ item }}"
  loop:
    - https://download1.rpmfusion.org/free/fedora/RPM-GPG-KEY-rpmfusion-free-fedora-2020
    - https://download1.rpmfusion.org/nonfree/fedora/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
  when: dotfiles_rpmfusion_repos.results | rejectattr('stat.exists') | list | length > 0

- name: Download the RPM Fusion release RPMs
  ansible.builtin.get_url:
    url: "https://download1.rpmfusion.org/{{ item }}/fedora/rpmfusion-{{ item }}-release-{{ ansible_facts['distribution_version'] }}.noarch.rpm"
    dest: "/tmp/rpmfusion-{{ item }}-release-{{ ansible_facts['distribution_version'] }}.noarch.rpm"
    mode: "0644"
  loop:
    - free
    - nonfree
  when: dotfiles_rpmfusion_repos.results | rejectattr('stat.exists') | list | length > 0

- name: Install the RPM Fusion release RPMs
  become: true
  ansible.builtin.command:
    argv:
      - rpm
      - -Uvh
      - "/tmp/rpmfusion-free-release-{{ ansible_facts['distribution_version'] }}.noarch.rpm"
      - "/tmp/rpmfusion-nonfree-release-{{ ansible_facts['distribution_version'] }}.noarch.rpm"
  when: dotfiles_rpmfusion_repos.results | rejectattr('stat.exists') | list | length > 0

- name: Configure the Microsoft Visual Studio Code repository
  become: true
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    gpgcheck: true
    enabled: true

- name: Configure the Google Chrome repository
  become: true
  ansible.builtin.yum_repository:
    name: google-chrome
    description: Google Chrome
    baseurl: https://dl.google.com/linux/chrome/rpm/stable/$basearch
    gpgkey: https://dl.google.com/linux/linux_signing_key.pub
    gpgcheck: true
    enabled: true
  when: ansible_facts['architecture'] == "x86_64"

- name: Configure the HashiCorp repository
  become: true
  ansible.builtin.yum_repository:
    name: hashicorp
    description: HashiCorp Stable - $basearch
    baseurl: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable
    gpgkey: https://rpm.releases.hashicorp.com/gpg
    gpgcheck: true
    enabled: true

- name: Configure the Tailscale repository
  become: true
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
    gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true

- name: Read Fedora package manifest
  ansible.builtin.set_fact:
    dotfiles_dnf_packages_all: >-
      {{
        lookup('ansible.builtin.file', dotfiles_repo_path ~ '/ansible/packages/dnf-packages.txt')
        .splitlines()
        | map('trim')
        | reject('match', '^#')
        | reject('equalto', '')
        | list
      }}

- name: Select Fedora packages for optional Flatpak installation
  ansible.builtin.set_fact:
    dotfiles_dnf_packages: >-
      {{
        dotfiles_dnf_packages_all
        | reject('equalto', 'flatpak')
        | list
        if not dotfiles_install_flatpak_apps | bool
        else dotfiles_dnf_packages_all
      }}

- name: Exclude explicitly skipped Fedora packages
  ansible.builtin.set_fact:
    dotfiles_dnf_packages: >-
      {{
        dotfiles_dnf_packages
        | reject('in', dotfiles_fedora_skip_packages)
        | list
      }}

- name: Select Fedora packages for this architecture
  ansible.builtin.set_fact:
    dotfiles_dnf_packages: >-
      {{
        dotfiles_dnf_packages
        | reject('equalto', 'google-chrome-stable')
        | list
        if ansible_facts['architecture'] != 'x86_64'
        else dotfiles_dnf_packages
      }}

- name: Check which Copr repositories are enabled
  ansible.builtin.stat:
    path: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:{{ item.repo | replace('/', ':') }}.repo"
  loop: "{{ dotfiles_fedora_copr_repos | selectattr('package', 'in', dotfiles_dnf_packages) | list }}"
  loop_control:
    label: "{{ item.repo }}"
  register: dotfiles_copr_repo_status

- name: Enable required Copr repositories
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - "{{ item.item.repo }}"
  loop: "{{ dotfiles_copr_repo_status.results }}"
  loop_control:
    label: "{{ item.item.repo }}"
  when: not item.stat.exists

- name: Check whether the Starship Copr repository is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:atim:starship.repo
  register: dotfiles_starship_copr_repo
  when: "'starship' in dotfiles_dnf_packages"

- name: Enable the Starship Copr repository
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - atim/starship
  when:
    - "'starship' in dotfiles_dnf_packages"
    - not dotfiles_starship_copr_repo.stat.exists

- name: Check whether the Ghostty Copr repository is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo
  register: dotfiles_ghostty_copr_repo
  when: "'ghostty' in dotfiles_dnf_packages"

- name: Enable the Ghostty Copr repository
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - scottames/ghostty
  when:
    - "'ghostty' in dotfiles_dnf_packages"
    - not dotfiles_ghostty_copr_repo.stat.exists

- name: Check whether the LazyGit Copr repository is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:dejan:lazygit.repo
  register: dotfiles_lazygit_copr_repo
  when: "'lazygit' in dotfiles_dnf_packages"

- name: Enable the LazyGit Copr repository
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - dejan/lazygit
  when:
    - "'lazygit' in dotfiles_dnf_packages"
    - not dotfiles_lazygit_copr_repo.stat.exists

- name: Check whether the Yazi Copr repository is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:lihaohong:yazi.repo
  register: dotfiles_yazi_copr_repo
  when: "'yazi' in dotfiles_dnf_packages"

- name: Enable the Yazi Copr repository
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - copr
      - enable
      - --assumeyes
      - lihaohong/yazi
  when:
    - "'yazi' in dotfiles_dnf_packages"
    - not dotfiles_yazi_copr_repo.stat.exists

- name: Install Fedora packages
  become: true
  ansible.builtin.dnf:
    name: "{{ dotfiles_dnf_packages }}"
    state: present
    update_cache: true

- name: Install pipx
  become: true
  ansible.builtin.dnf:
    name: pipx
    state: present

- name: Install the user-installed-packages helper for the drift report
  ansible.builtin.command:
    argv:
      - pipx
      - install
      - "git+https://github.com/gokul-t/user-installed-packages.git@{{ dotfiles_user_installed_packages_version }}"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/user-installed-packages"

- name: Install the sesh Zsh completion
  ansible.builtin.include_tasks: sesh-completion.yml
  when: "'tmux-sesh' in dotfiles_dnf_packages"

- name: Read Flatpak application manifest
  ansible.builtin.set_fact:
    dotfiles_flatpak_apps: >-
      {{
        lookup('ansible.builtin.file', dotfiles_repo_path ~ '/ansible/packages/flatpak-packages.txt')
        .splitlines()
        | map('trim')
        | reject('match', '^#')
        | reject('equalto', '')
        | list
      }}
  when: dotfiles_install_flatpak_apps | bool

- name: List configured system Flatpak remotes
  become: true
  ansible.builtin.command:
    argv:
      - flatpak
      - remote-list
      - --system
      - --columns=name
  register: dotfiles_flatpak_remotes
  changed_when: false
  when: dotfiles_install_flatpak_apps | bool

- name: Add required system Flatpak remotes
  become: true
  ansible.builtin.command:
    argv:
      - flatpak
      - remote-add
      - --system
      - --if-not-exists
      - "{{ item.name }}"
      - "{{ item.url }}"
  loop:
    - name: flathub
      url: https://dl.flathub.org/repo/flathub.flatpakrepo
    - name: fedora
      url: https://dl.fedoraproject.org/pub/flatpak/repo/fedora.flatpakrepo
  when:
    - dotfiles_install_flatpak_apps | bool
    - item.name not in dotfiles_flatpak_remotes.stdout_lines

- name: List installed system Flatpak applications
  become: true
  ansible.builtin.command:
    argv:
      - flatpak
      - list
      - --system
      - --app
      - --columns=application
  register: dotfiles_installed_flatpak_apps
  changed_when: false
  when: dotfiles_install_flatpak_apps | bool

- name: Install missing Flatpak applications
  become: true
  ansible.builtin.command:
    argv:
      - dbus-run-session
      - --
      - flatpak
      - install
      - --system
      - --assumeyes
      - --noninteractive
      - "{{ item.split()[0] }}"
      - "{{ item.split()[1] }}"
  loop: "{{ dotfiles_flatpak_apps }}"
  when:
    - dotfiles_install_flatpak_apps | bool
    - item.split()[1] not in dotfiles_installed_flatpak_apps.stdout_lines

- name: Create user font directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
    state: directory
    mode: "0755"

- name: Check for the Meslo Nerd Font
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
    patterns: "MesloLGS NF Regular.ttf"
    recurse: true
  register: dotfiles_meslo_font

- name: Download Meslo Nerd Font archive
  ansible.builtin.get_url:
    url: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Meslo.zip
    dest: /tmp/dotfiles-meslo-nerd-fonts.zip
    mode: "0644"
  when: dotfiles_meslo_font.matched == 0

- name: Install Meslo Nerd Font
  ansible.builtin.unarchive:
    src: /tmp/dotfiles-meslo-nerd-fonts.zip
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
    remote_src: true
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/MesloLGS NF Regular.ttf"
  when: dotfiles_meslo_font.matched == 0
  register: dotfiles_meslo_font_install

- name: Refresh user font cache
  ansible.builtin.command:
    argv:
      - fc-cache
      - -f
      - "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
  when: dotfiles_meslo_font_install.changed | default(false)
