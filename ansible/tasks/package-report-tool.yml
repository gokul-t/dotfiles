- name: Check the installed user-installed-packages version
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/user-installed-packages"
      - --version
  register: dotfiles_user_installed_packages_installed
  changed_when: false
  failed_when: false

- name: Install or update user-installed-packages
  ansible.builtin.command:
    argv:
      - pipx
      - install
      - --force
      - "git+https://github.com/gokul-t/user-installed-packages.git@{{ dotfiles_user_installed_packages_version }}"
  when: >-
    dotfiles_user_installed_packages_installed.rc != 0 or
    dotfiles_user_installed_packages_installed.stdout | default('') | trim !=
    ('user-installed-packages ' ~
     (dotfiles_user_installed_packages_version | regex_replace('^v', '')))
