# Shared bin packages (installed via the bin binary manager).
- name: uv
  source: github.com/astral-sh/uv
  asset_pattern: "uv-*-linux-gnu*/uv"
- name: uvx
  source: github.com/astral-sh/uv
  asset_pattern: "uv-*-linux-gnu*/uvx"
- name: user-installed-packages
  source: github.com/gokul-t/user-installed-packages
- name: ghq
  source: github.com/x-motemen/ghq
  asset_pattern: "ghq_linux_*/ghq"
- name: worktrunk
  source: github.com/max-sixty/worktrunk
  asset_pattern: "worktrunk-*-unknown-linux-musl.tar.xz/wt"

