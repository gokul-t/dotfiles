---
dotfiles_profile: default
dotfiles_repo_path: "{{ playbook_dir | dirname }}"
dotfiles_stow_target: "{{ ansible_facts['env']['HOME'] }}"
dotfiles_install_flatpak_apps: true
dotfiles_install_snap_apps: true
dotfiles_skip_tools: []
# Bin packages are loaded from tiered overlay YAML files:
# - ansible/packages/bin-packages.yml (shared)
# - personal/ansible/packages/bin-packages.yml (personal overlay)
# - work/ansible/packages/bin-packages.yml (work overlay, if enabled)
dotfiles_bin_packages_personal: []
dotfiles_fedora_skip_packages: []
dotfiles_fedora_copr_repos:
  - package: tmux-sesh
    repo: buckaroogeek/Tmux_sesh
  - package: starship
    repo: atim/starship
  - package: ghostty
    repo: scottames/ghostty
  - package: lazygit
    repo: dejan/lazygit
  - package: yazi
    repo: lihaohong/yazi
  - package: fedy
    repo: kwizart/fedy
dotfiles_ubuntu_skip_packages: []
dotfiles_package_report_schedule: false
dotfiles_package_report_cron_fallback: false
dotfiles_package_report_dir: "{{ ansible_facts['env']['HOME'] }}/.local/state/dotfiles"
dotfiles_stow_packages: []
dotfiles_stow_skip_packages:
  - ansible
  - vimium
  - windows
dotfiles_stow_strict: false
dotfiles_private_enabled: false
dotfiles_private_profile: ""
dotfiles_private_path: "{{ dotfiles_repo_path }}/{{ dotfiles_private_profile }}"
