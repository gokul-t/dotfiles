unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Options
# Fix colors inside tmux to match Ghostty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Cc=\E]12;%p1%s\007"
set -as terminal-features ",xterm-256color:RGB"


set -g extended-keys always  # passthrough disambiguated keys (e.g. Ctrl+[) from Ghostty/Kitty protocol terminals.
set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000  # increase "prefix-free" window

# Options: start indexes from 1
set -g base-index 1
set -g pane-base-index 1

set -g mode-keys vi  # use vi keybindings in copy mode
# Better Prefix
# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix

# Windows
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# Session behavior
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# Sesh
# Session picker
bind-key "T" run-shell "~/bin/sesh-session-picker"

# Window picker (current session)
bind-key "W" run-shell "window=\"$(sesh window | fzf-tmux -p 60%,50% --prompt '🪟  ')\"; if [ -n \"\$window\" ]; then sesh window \"\$window\"; fi"

# Session navigation
bind -N "last-session (via sesh) " L run-shell "sesh last"
bind -N "switch to root session (via sesh) " 9 run-shell "sesh connect --root $(pwd)"

# Enrich newly created session names with GitHub issue titles
set-hook -g session-created 'run-shell -b "sesh rename --enrich"'

# Split
bind h split-window -h
bind | split-window -h
bind v split-window -v
bind - split-window -v

# === Look & Feel ===

# Style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=${gray_dark}"
set -g status-left "#[fg=${green_soft},bold] #S #[fg=${gray_light},nobold] | "
set -g status-right " #{cpu_percentage}   #{gpu_percentage}  #{ram_percentage} "
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${green_soft}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'gokul-t/tmux-cpu#add-macos-powermetrics-gpu'

# Matching theme plugin (e.g., Catppuccin)
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'macchiato' # match Ghostty flavor

# set -g @plugin 'folke/tokyonight-tmux'
# set -g @tokyonight_style "moon"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
