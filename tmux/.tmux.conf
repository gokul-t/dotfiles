
# ==========================================
# General
# ==========================================

unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

set -g mouse on
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g mode-keys vi
set -g detach-on-destroy off

# Repeatable commands
set -g repeat-time 1000

# ==========================================
# Terminal
# ==========================================

set -g default-terminal "tmux-256color"

# Ghostty capabilities
set -as terminal-features ",xterm-ghostty:RGB,extkeys"

set -s extended-keys always
set -sg escape-time 0

# Linux clipboard
if-shell '[ "$(uname)" = Linux ]' \
    'set -s set-clipboard on'

# ==========================================
# Window management
# ==========================================

bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# ==========================================
# Pane management
# ==========================================

bind-key x kill-pane

bind h split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ==========================================
# Sesh
# ==========================================

bind-key "T" run-shell "~/bin/sesh-session-picker"

bind-key "W" run-shell \
    "window=\"$(sesh window | fzf-tmux -p 60%,50% --prompt '🪟  ')\"; if [ -n \"\$window\" ]; then sesh window \"\$window\"; fi"

bind -N "last-session (via sesh)" L run-shell "sesh last"

bind -N "switch to root session (via sesh)" \
    9 run-shell "sesh connect --root $(pwd)"

set-hook -g session-created \
    'run-shell -b "sesh rename --enrich"'

# ==========================================
# Plugins
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'gokul-t/tmux-cpu#add-macos-powermetrics-gpu'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ==========================================
# Theme
# ==========================================

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"

set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text \
    "#W#{?window_zoomed_flag,(),}"

# Cap the directory status text so long paths do not overflow the status bar.
set -g @catppuccin_directory_text "#{=/20/...:#{b:pane_current_path}}"

# Cap the session status text so long session names do not overflow the status bar.
set -g @catppuccin_session_text " #{=/12/...:#{session_name}}"

# ==========================================
# Status bar
# ==========================================

set -g status-position top
set -g status-style bg=default
set -g status-right-length 120
set -g status-left-length 50
set -g window-status-separator ""

# Load Catppuccin before using its status modules.
# Verify this path against your TPM installation.
run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g status-left "#{E:@catppuccin_status_session}"

set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"

# set -ag status-right \
#     "#[bg=#{@thm_teal},fg=#{@thm_crust}]#[reverse]#[noreverse]󱀙 "
#
# set -ag status-right \
#     "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #{gpu_percentage} "

set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# ==========================================
# Transparency
# ==========================================

set -g window-style bg=default
set -g window-active-style bg=default
set -g window-status-style bg=default
set -g window-status-current-style bg=default

# ==========================================
# TPM - MUST BE LAST
# ==========================================

run '~/.tmux/plugins/tpm/tpm'
