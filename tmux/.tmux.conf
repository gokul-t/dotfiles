unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Terminal configuration
set -g default-terminal "tmux-256color"

# Ghostty terminal capabilities
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:extkeys"

# Extended keyboard support
set -s extended-keys always
set -sg escape-time 0
set -g mouse on
# Enable tmux clipboard integration on Linux
if-shell '[ "$(uname)" = Linux ]' {
    set -s set-clipboard on
}
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000 # Time window for repeating repeatable commands

# Options: start indexes from 1
set -g base-index 1
set -g pane-base-index 1

set -g mode-keys vi  # use vi keybindings in copy mode
# Better Prefix
# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix

# Windows
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# Session behavior
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# Sesh
# Session picker
bind-key "T" run-shell "~/bin/sesh-session-picker"

# Window picker (current session)
bind-key "W" run-shell "window=\"$(sesh window | fzf-tmux -p 60%,50% --prompt '🪟  ')\"; if [ -n \"\$window\" ]; then sesh window \"\$window\"; fi"

# Session navigation
bind -N "last-session (via sesh) " L run-shell "sesh last"
bind -N "switch to root session (via sesh) " 9 run-shell "sesh connect --root $(pwd)"

# Enrich newly created session names with GitHub issue titles
set-hook -g session-created 'run-shell -b "sesh rename --enrich"'

# Split
# Create new panes in the current pane's directory
bind h split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
# Matching theme plugin (e.g., Catppuccin)
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'gokul-t/tmux-cpu#add-macos-powermetrics-gpu'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# === Look & Feel ===

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"

set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "right"

# Load Catppuccin theme before using its variables
run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
# set -g @catppuccin_cpu_text " #{cpu_percentage} | #{gpu_percentage}"
# Make the status line pretty and add some modules
set -g status-position top
set -g status-right-length 120
set -g status-left-length 50
# Make the status line more pleasant.
set -g status-left ""
set -gF status-left "#{E:@catppuccin_status_session}"

# Ensure that everything on the right side of the status line
# is included.
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#[bg=#{@thm_teal},fg=#{@thm_crust}]#[reverse]#[noreverse]󱀙 "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #{gpu_percentage} "
set -agF status-right "#{E:@catppuccin_status_ram}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Make the status bar transparent (tmux 3.2+)
set -g status-style bg=default

# Ensure window panes use the terminal's default transparent background
set -g window-style bg=default
set -g window-active-style bg=default

# Optional: Remove background color from inactive/active window tabs
set -g window-status-style bg=default
set -g window-status-current-style bg=default
