name: Ansible

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax and YAML validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ansible and YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ansible-core python3-yaml

      - name: Parse Ansible YAML files
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path("ansible").rglob("*.yml")):
              with path.open() as stream:
                  yaml.safe_load(stream)
              print(f"Valid YAML: {path}")
          PY

      - name: Check playbook syntax
        run: ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check

  stow-selection:
    name: Stow package selection
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ansible and Stow
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ansible-core stow

      - name: Check Stow selection against disposable targets
        run: bash ansible/containers/test-stow.sh

  fedora-container:
    name: Fedora 44 provisioning
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Fedora provisioning image
        run: docker build --file ansible/containers/fedora.Dockerfile --tag dotfiles-fedora-test .

      - name: Provision Fedora container and verify idempotence
        run: docker run --rm dotfiles-fedora-test

  ubuntu-container:
    name: Ubuntu 24.04 provisioning
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Ubuntu provisioning image
        run: docker build --file ansible/containers/ubuntu.Dockerfile --tag dotfiles-ubuntu-test .

      - name: Provision Ubuntu container and verify idempotence
        run: docker run --rm dotfiles-ubuntu-test

  server-container:
    name: ${{ matrix.name }} server provisioning
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Debian 13
            image: debian:13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build server provisioning image
        run: >-
          docker build --build-arg BASE_IMAGE=${{ matrix.image }}
          --file ansible/containers/server.Dockerfile --tag dotfiles-server-test .

      - name: Provision server container, verify idempotence and results
        run: docker run --rm dotfiles-server-test
