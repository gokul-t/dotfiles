#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

[[session]]
name = "Dotfiles 🏠"
path = "~/.dotfiles"
icon = "🏠"
startup_command = "nvim"
preview_command = "bat --color=always ~/.dotfiles/README.md"
windows = [ "dotfiles-window2", "ai_coding_tool" ]

[[session]]
name = "Notes 📓"
path = "~/Documents/notes"
startup_command = "nvim"
icon = "📓"
windows = [ "yazi"]

[[session]]
name = "Downloads 📥"
path = "~/Downloads"
icon = "📥"
startup_command = "curl wttr.in"
windows = [ "yazi"]

[[wildcard]]
pattern = "~/Developer/repos/*/*"
icon = ""
startup_command = "nvim"
windows = [ "git", "ai_coding_tool"]

[[window]]
name = "nvim"
startup_script = "nvim"

[[window]]
name = "git"
startup_script = "git status"

[[window]]
name = "ai_coding_tool"
startup_script = "$AI_CODING_TOOL"

[[window]]
name = "lazygit"
startup_script = "lazygit"

[[window]]
name = "yazi"
startup_script = "yazi"

[[window]]
name = "dotfiles-window2"
startup_script = "git status"
# panes = [ "dotfiles-parent-pane", "dotfiles-private-pane" ]
# layout = "main-vertical"

[[pane]]
name = "dotfiles-parent-pane"
startup_command = "git status"
focus = true

[[pane]]
name = "dotfiles-private-pane"
startup_command = "cd ./$DOTFILES_PROFILE && git status"
